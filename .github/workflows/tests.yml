name: Quality matrix

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        dependencies: [lowest, highest]
        exclude:
          - php: '8.2'
            laravel: '13'
    env:
      LARAVEL_MAJOR: ${{ matrix.laravel }}
      DEPENDENCIES: ${{ matrix.dependencies }}
      COMPOSER_NO_INTERACTION: 1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Resolve and verify dependencies
        id: dependencies
        run: |
          case "$LARAVEL_MAJOR" in
            12) testbench='^10.8.0' ;;
            13) testbench='^11.0' ;;
          esac
          constraint=$(php -r '
              $manifest = json_decode(file_get_contents("composer.json"), true, flags: JSON_THROW_ON_ERROR);
              foreach (explode("|", $manifest["require"]["laravel/framework"]) as $constraint) {
                  if (str_starts_with($constraint, "^" . getenv("LARAVEL_MAJOR") . ".")) {
                      echo $constraint;
                      exit(0);
                  }
              }
              exit(1);
          ')
          echo "framework-floor=${constraint#^}" >> "$GITHUB_OUTPUT"
          options=(--prefer-stable --prefer-dist --no-progress)
          if [[ "$DEPENDENCIES" == lowest ]]; then
            options+=(--prefer-lowest)
          fi
          composer update "${options[@]}" --with "laravel/framework:$constraint" --with "orchestra/testbench:$testbench"
          for dependency in laravel/framework orchestra/testbench phpunit/phpunit ramsey/uuid; do
            composer show "$dependency"
          done
          composer check
      - name: Verify a clean Laravel application
        env:
          FRAMEWORK_FLOOR: ${{ steps.dependencies.outputs.framework-floor }}
        if: matrix.dependencies == 'highest' || (matrix.php == '8.2' && matrix.laravel == '12') || (matrix.php == '8.3' && matrix.laravel == '13')
        run: |
          version=$(php -r 'require "vendor/autoload.php"; echo Composer\InstalledVersions::getPrettyVersion("laravel/framework");')
          skeleton="^$LARAVEL_MAJOR.0"
          if [[ "$DEPENDENCIES" == lowest ]]; then
            version="$FRAMEWORK_FLOOR"
            skeleton="$version"
          fi
          composer create-project --no-install --no-scripts --no-progress laravel/laravel "$RUNNER_TEMP/fillmap-host" "$skeleton"
          cd "$RUNNER_TEMP/fillmap-host"
          composer config --json repositories.fillmap "{\"type\":\"path\",\"url\":\"$GITHUB_WORKSPACE\",\"options\":{\"symlink\":false,\"versions\":{\"mattmy/laravel-attribute-mapper\":\"dev-main\"}}}"
          php -r '$m = json_decode(file_get_contents("composer.json"), true, flags: JSON_THROW_ON_ERROR); unset($m["require-dev"]); file_put_contents("composer.json", json_encode($m, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);'
          composer require --no-update "laravel/framework:$version" mattmy/laravel-attribute-mapper:dev-main
          if [[ "$DEPENDENCIES" == lowest ]]; then
            # Exercise the historical framework only in this temporary compatibility project.
            composer config --json policy.advisories.ignore '{"laravel/framework":{"on-audit":false}}'
          fi
          if [[ "$DEPENDENCIES" == lowest && "$LARAVEL_MAJOR" == 12 ]]; then
            # Laravel 12.0 Artisan cannot boot with Symfony Console 7.4.
            composer require --no-update 'symfony/console:~7.3.0'
            uuid_floor=$(php -r 'echo substr(json_decode(file_get_contents($argv[1]), true, flags: JSON_THROW_ON_ERROR)["require"]["ramsey/uuid"], 1);' "$GITHUB_WORKSPACE/composer.json")
            composer require --no-update "ramsey/uuid:$uuid_floor"
          fi
          composer update --no-dev --no-scripts --prefer-dist --no-progress
          composer show laravel/framework
          composer show ramsey/uuid
          composer check-platform-reqs
          if [[ "$DEPENDENCIES" == lowest ]]; then
            audit="$RUNNER_TEMP/fillmap-floor-audit.json"
            composer audit --no-dev --format=json > "$audit" || [[ $? == 1 ]]
            cat "$audit"
            php -r '
                $audit = json_decode(file_get_contents($argv[1]), true, flags: JSON_THROW_ON_ERROR);
                exit(is_array($audit["advisories"] ?? null)
                    && array_diff(array_keys($audit["advisories"]), ["laravel/framework"]) === []
                    && ($audit["abandoned"] ?? []) === []
                    && ($audit["filter"] ?? []) === []
                    && ($audit["cooldown"] ?? []) === []
                    && ($audit["unreachable-repositories"] ?? []) === [] ? 0 : 1);
            ' "$audit"
          else
            composer audit --no-dev
          fi
          php artisan package:discover
          php artisan config:cache
          php "$GITHUB_WORKSPACE/tests/host-smoke.php"
          php artisan vendor:publish --tag=attribute-mapper-config --no-interaction
          test -f config/attribute-mapper.php
          sed -i 's/InputKeyStyle::Exact/InputKeyStyle::Camel/' config/attribute-mapper.php
          php artisan config:cache
          php "$GITHUB_WORKSPACE/tests/host-smoke.php" camel-enum
          sed -i "s/InputKeyStyle::Camel/'Camel'/" config/attribute-mapper.php
          php artisan config:cache
          php "$GITHUB_WORKSPACE/tests/host-smoke.php" camel-string
      - name: Record the native PHP 8.2 benchmark
        if: matrix.php == '8.2' && matrix.dependencies == 'highest'
        run: php tests/benchmarks/attribute-mapping.php
      - run: git diff --check
